name: ai_singing_coach
description: "AI Singing Coach"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.4
  firebase_storage: ^12.4.4

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # Audio
  record: ^6.0.0
  audioplayers: ^6.1.0
  just_audio: ^0.10.0

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/